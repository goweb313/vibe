    <style>

        body, button, a, div {

        body {
            overflow: hidden;
            background-color: #030a16;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        /* 玻璃拟态面板 */
        .glass-panel {
            background: rgba(8, 20, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }

        /* ========== 👀 真实流畅眨眼 CSS 动画 ========== */
        @keyframes realBlink {
            0%, 82%, 100% {
                transform: scaleY(1);
                filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8));
            }
            88% {
                transform: scaleY(0.03);
                filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.3));
            }
            94% {
                transform: scaleY(1);
            }
        }
        .eye-blinking-img {
            animation: realBlink 3.5s ease-in-out infinite;
            transform-origin: center center;
            display: inline-block;
        }

        /* ========== ✨ 顶部标语：文字流光 + 炫酷闪烁霓虹特效 ========== */
        .vibe-text-glowing {
            background: linear-gradient(90deg, #38bdf8, #00f0ff, #facc15, #f43f5e, #a855f7, #38bdf8);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFlow 4s linear infinite, textGlowPulse 2s ease-in-out infinite alternate;
        }

        @keyframes textFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes textGlowPulse {
            0% { filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6)) drop-shadow(0 0 20px rgba(0, 240, 255, 0.3)); }
            100% { filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.9)) drop-shadow(0 0 35px rgba(244, 63, 94, 0.6)); }
        }

        /* ========== 🤖 机器人随机悬浮动画 ========== */
        @keyframes floatRandom1 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            33% { transform: translate(25px, -35px) rotate(4deg); }
            66% { transform: translate(-20px, 30px) rotate(-3deg); }
        }
        @keyframes floatRandom2 {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            40% { transform: translate(-30px, -25px) rotate(-5deg); }
            75% { transform: translate(20px, 25px) rotate(3deg); }
        }
        .robot-float-1 { animation: floatRandom1 8s ease-in-out infinite; }
        .robot-float-2 { animation: floatRandom2 11s ease-in-out infinite; }

        /* ========== 🌌 3D 机甲星际之门特效 ========== */
        .stargate-frame {
            position: relative;
            padding: 6px;
            background: radial-gradient(circle, #0b2545 0%, #030a16 100%);
            border-radius: 9999px;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.3);
            width: 280px;
        }

        .stargate-door-container {
            position: relative;
            width: 100%;
            height: 48px;
            border-radius: 9999px;
            overflow: hidden;
            background: #020b18;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stargate-door {
            position: absolute;
            top: 0;
            width: 50.5%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1.5px solid #00f0ff;
            z-index: 20;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stargate-door-left {
            left: 0;
            border-top-left-radius: 9999px;
            border-bottom-left-radius: 9999px;
            border-right: 2px solid #00f0ff;
            background-image: repeating-linear-gradient(45deg, rgba(0, 240, 255, 0.15) 0, rgba(0, 240, 255, 0.15) 6px, transparent 6px, transparent 12px);
        }

        .stargate-door-right {
            right: 0;
            border-top-right-radius: 9999px;
            border-bottom-right-radius: 9999px;
            border-left: 2px solid #00f0ff;
            background-image: repeating-linear-gradient(-45deg, rgba(0, 240, 255, 0.15) 0, rgba(0, 240, 255, 0.15) 6px, transparent 6px, transparent 12px);

        .stargate-frame:hover .stargate-door-left { transform: translateX(-100%) scaleX(0.9); }
        .stargate-frame:hover .stargate-door-right { transform: translateX(100%) scaleX(0.9); }
        .stargate-frame:hover {

        @keyframes logoFlashAnim {

    <!-- 🌌 背景 Canvas 渲染引擎（完美融合图示：左侧六边形网格 + 中间波动数据流 + 右侧精密电路走线） -->
    <script>
        const bgCanvas = document.getElementById('web3-bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
        resizeBg();
        window.addEventListener('resize', resizeBg);

        // 初始化六边形网格数据（左侧）
        const hexRadius = 28;
        const hexHeight = hexRadius * Math.sqrt(3);
        const hexWidth = hexRadius * 2;

        let waveOffset = 0;

        function drawHexagon(ctx, x, y, r, alpha) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const hx = x + r * Math.cos(angle);
                const hy = y + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function renderTechBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // 1. 深空渐变背景
            let radialGrad = bgCtx.createRadialGradient(bgCanvas.width*0.5, bgCanvas.height*0.5, 50, bgCanvas.width*0.5, bgCanvas.height*0.5, bgCanvas.width*0.8);
            radialGrad.addColorStop(0, '#061c3a');
            radialGrad.addColorStop(1, '#020610');
            bgCtx.fillStyle = radialGrad;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            // 2. 左侧：蜂窝六边形网格群
            bgCtx.save();
            const hexCols = Math.floor((bgCanvas.width * 0.45) / (hexWidth * 0.75));
            const hexRows = Math.floor(bgCanvas.height / hexHeight) + 1;
            for (let r = 0; r < hexRows; r++) {
                for (let c = 0; c < hexCols; c++) {
                    const x = c * hexWidth * 0.75 + 40;
                    const y = r * hexHeight + (c % 2 === 0 ? 0 : hexHeight * 0.5) + 20;
                    // 动态调整透明度形成呼吸感
                    const alpha = 0.12 + Math.sin(waveOffset * 1.5 + c * 0.3 + r * 0.2) * 0.08;
                    drawHexagon(bgCtx, x, y, hexRadius * 0.95, Math.max(0.03, alpha));
                }
            }
            bgCtx.restore();

            // 3. 中间与贯穿全屏：多层数据波浪曲线
            bgCtx.save();
            for (let i = 0; i < 3; i++) {
                bgCtx.beginPath();
                bgCtx.moveTo(0, bgCanvas.height * 0.5);
                for (let x = 0; x < bgCanvas.width; x += 15) {
                    const freq = 0.008 + i * 0.003;
                    const amp = 40 + i * 25;
                    const y = bgCanvas.height * 0.5 + Math.sin(x * freq + waveOffset * (i + 1) * 0.8) * amp * Math.cos((x / bgCanvas.width) * Math.PI);
                    bgCtx.lineTo(x, y);
                }
                bgCtx.strokeStyle = i === 0 ? 'rgba(0, 240, 255, 0.6)' : (i === 1 ? 'rgba(56, 189, 248, 0.35)' : 'rgba(250, 204, 21, 0.3)');
                bgCtx.lineWidth = 2 - i * 0.5;
                bgCtx.shadowBlur = 12;
                bgCtx.shadowColor = '#00f0ff';
                bgCtx.stroke();
            }
            bgCtx.restore();

            // 4. 右侧：精密电路走线与数据指示面板（对应图示右侧元素）
            bgCtx.save();
            const rightStartX = bgCanvas.width - 320;
            
            // 电路折线群
            const circuitPaths = [
                { startY: 80, points: [[0, 0], [-100, 0], [-140, 40], [-260, 40]] },
                { startY: 140, points: [[0, 0], [-80, 0], [-120, 30], [-220, 30]] },
                { startY: 200, points: [[0, 0], [-120, 0], [-160, -30], [-300, -30]] },
                { startY: bgCanvas.height - 120, points: [[0, 0], [-90, 0], [-150, -50], [-280, -50]] },
                { startY: bgCanvas.height - 180, points: [[0, 0], [-130, 0], [-170, -40], [-250, -40]] }
            ];

            circuitPaths.forEach((cp, idx) => {
                let cx = bgCanvas.width - 40;
                let cy = cp.startY;
                bgCtx.beginPath();
                bgCtx.moveTo(cx, cy);
                cp.points.forEach(pt => {
                    cx += pt[0];
                    cy += pt[1];
                    bgCtx.lineTo(cx, cy);
                });
                bgCtx.strokeStyle = idx % 2 === 0 ? 'rgba(0, 240, 255, 0.5)' : 'rgba(56, 189, 248, 0.4)';
                bgCtx.lineWidth = 1.5;
                bgCtx.shadowBlur = 8;
                bgCtx.shadowColor = '#00f0ff';
                bgCtx.stroke();

                // 终点/节点小亮圆
                bgCtx.beginPath();
                bgCtx.arc(cx, cy, 3, 0, Math.PI * 2);
                bgCtx.fillStyle = '#00f0ff';
                bgCtx.fill();
            });

            // 右侧微型数据柱状图 (HUD Bar Charts)
            const barGroups = [
                { x: bgCanvas.width - 220, y: 160 },
                { x: bgCanvas.width - 160, y: bgCanvas.height - 200 }
            ];
            barGroups.forEach(bg => {
                for (let b = 0; b < 6; b++) {
                    const h = 10 + Math.sin(waveOffset * 3 + b) * 20 + 15;
                    bgCtx.fillStyle = b % 2 === 0 ? 'rgba(0, 240, 255, 0.6)' : 'rgba(250, 204, 21, 0.6)';
                    bgCtx.fillRect(bg.x + b * 8, bg.y - h, 5, h);
                }
            });

            bgCtx.restore();

            waveOffset += 0.02;
            requestAnimationFrame(renderTechBackground);
        }
        renderTechBackground();
    </script>

    <!-- ⚡ 激光与签到定位光束 Canvas 系统 -->
    <script>
        const laserCanvas = document.getElementById('laser-canvas');
        const laserCtx = laserCanvas.getContext('2d');
        function resizeLaser() { laserCanvas.width = window.innerWidth; laserCanvas.height = window.innerHeight; }
        resizeLaser();
        window.addEventListener('resize', resizeLaser);

        let lasers = [];
        let ipTargetBeams = [];
        const laserColors = ['#00f0ff', '#ff0055', '#00ff66', '#ffaa00', '#b000ff', '#ffffff'];

        setInterval(() => {
            const bots = document.querySelectorAll('.bot-node');
            if (bots.length === 0) return;
            const randomBot = bots[Math.floor(Math.random() * bots.length)];
            const rect = randomBot.getBoundingClientRect();
            const x = rect.left + rect.width * 0.5;
            const y = rect.top + rect.height * 0.35;
            const angle = Math.random() * Math.PI * 2;
            const len = 150 + Math.random() * 200;
            lasers.push({ x, y, targetX: x + Math.cos(angle) * len, targetY: y + Math.sin(angle) * len, color: laserColors[Math.floor(Math.random() * laserColors.length)], width: 2, life: 1.0 });
        }, 350);

        function triggerEarthTargetBeams(targetScreenX, targetScreenY) {
            const sources = [
                { x: 0, y: 0 }, { x: window.innerWidth, y: 0 },
                { x: 0, y: window.innerHeight }, { x: window.innerWidth, y: window.innerHeight },
                { x: window.innerWidth * 0.5, y: 0 }, { x: 0, y: window.innerHeight * 0.5 },
                { x: window.innerWidth, y: window.innerHeight * 0.5 }
            ];

            sources.forEach((src, idx) => {
                ipTargetBeams.push({
                    startX: src.x, startY: src.y,
                    endX: targetScreenX, endY: targetScreenY,
                    progress: 0, color: laserColors[idx % laserColors.length], width: 4, life: 1.2
                });
            });

            for (let i = 0; i < 4; i++) {
                ipTargetBeams.push({
                    isRing: true, x: targetScreenX, y: targetScreenY,
                    radius: 20 + i * 25, maxRadius: 160, life: 1.0, color: '#facc15'
                });
            }
        }

        function drawLasers() {
            laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);

            for (let i = 0; i < lasers.length; i++) {
                let l = lasers[i];
                laserCtx.beginPath();
                laserCtx.moveTo(l.x, l.y);
                laserCtx.lineTo(l.targetX, l.targetY);
                laserCtx.strokeStyle = l.color;
                laserCtx.lineWidth = l.width;
                laserCtx.globalAlpha = l.life;
                laserCtx.shadowBlur = 10;
                laserCtx.shadowColor = l.color;
                laserCtx.stroke();
                l.life -= 0.04;
                if (l.life <= 0) { lasers.splice(i, 1); i--; }
            }

            for (let i = 0; i < ipTargetBeams.length; i++) {
                let b = ipTargetBeams[i];

                if (b.isRing) {
                    laserCtx.save();
                    laserCtx.beginPath();
                    laserCtx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    laserCtx.strokeStyle = b.color;
                    laserCtx.lineWidth = 3;
                    laserCtx.globalAlpha = b.life;
                    laserCtx.shadowBlur = 25;
                    laserCtx.shadowColor = '#facc15';
                    laserCtx.stroke();
                    laserCtx.restore();

                    b.radius += 3.5;
                    b.life -= 0.02;
                    if (b.radius > b.maxRadius || b.life <= 0) { ipTargetBeams.splice(i, 1); i--; }
                } else {
                    laserCtx.save();
                    let currentX = b.startX + (b.endX - b.startX) * Math.min(1, b.progress);
                    let currentY = b.startY + (b.endY - b.startY) * Math.min(1, b.progress);

                    laserCtx.beginPath();
                    laserCtx.moveTo(b.startX, b.startY);
                    laserCtx.lineTo(currentX, currentY);
                    laserCtx.strokeStyle = b.color;
                    laserCtx.lineWidth = b.width;
                    laserCtx.globalAlpha = b.life;
                    laserCtx.shadowBlur = 20;
                    laserCtx.shadowColor = b.color;
                    laserCtx.stroke();

                    laserCtx.beginPath();
                    laserCtx.arc(currentX, currentY, b.width * 1.8, 0, Math.PI * 2);
                    laserCtx.fillStyle = '#ffffff';
                    laserCtx.fill();
                    laserCtx.restore();

                    b.progress += 0.045;
                    if (b.progress >= 1) { b.life -= 0.03; }
                    if (b.life <= 0) { ipTargetBeams.splice(i, 1); i--; }
                }
            }

            requestAnimationFrame(drawLasers);
        }
        drawLasers();
    </script>

    <!-- 鼠标粒子系统 -->
    <script>
        const pCanvas = document.getElementById('particle-canvas');
        const pCtx = pCanvas.getContext('2d');
        function resizePCanvas() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        resizePCanvas();
        window.addEventListener('resize', resizePCanvas);
        const particles = [];
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                particles.push({ x: e.clientX, y: e.clientY, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2-1, size: 2+Math.random()*2, color: '#00f0ff', alpha: 1.0, decay: 0.03 });
            }
        });
        function animateParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha <= 0) { particles.splice(index, 1); return; }
                pCtx.save(); pCtx.globalAlpha = p.alpha;
                pCtx.fillStyle = p.color;
                pCtx.fillRect(p.x, p.y, p.size, p.size);
                pCtx.restore();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>

    <!-- 🌍 3D 地球、全网密集连线、多点城市眨眼图标、连线动态流动眨眼图标同步渲染 -->
    <script>
        const container = document.getElementById('earth-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 260;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const globeGroup = new THREE.Group();
        globeGroup.position.y = 15;
        scene.add(globeGroup);

        globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(65, 48, 48), new THREE.MeshBasicMaterial({ color: 0x071b36 })));
        globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(65.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.12 })));

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        const checkinLocations = [
            { name: "Tokyo", lat: 35.6762, lon: 139.6503 },
            { name: "New York", lat: 40.7128, lon: -74.0060 },
            { name: "London", lat: 51.5074, lon: -0.1278 },
            { name: "Singapore", lat: 1.3521, lon: 103.8198 },
            { name: "Dubai", lat: 25.2048, lon: 55.2708 },
            { name: "Sydney", lat: -33.8688, lon: 151.2093 },
            { name: "Frankfurt", lat: 50.1109, lon: 8.6821 },
            { name: "Seoul", lat: 37.5665, lon: 126.9780 },
            { name: "San Francisco", lat: 37.7749, lon: -122.4194 },
            { name: "São Paulo", lat: -23.5505, lon: -46.6333 },
            { name: "Cape Town", lat: -33.9249, lon: 18.4241 },
            { name: "Bangkok", lat: 13.7563, lon: 100.5018 }
        ];

        const connectionLinesGroup = new THREE.Group();
        globeGroup.add(connectionLinesGroup);

        const flowingEyeItems = [];
        const earthEyesContainer = document.getElementById('earth-eyes-container');

        function createArchLine(v1, v2, colorHex) {
            const distance = v1.distanceTo(v2);
            const midVector = v1.clone().add(v2).normalize().multiplyScalar(65 + distance * 0.32);
            const curve = new THREE.QuadraticBezierCurve3(v1, midVector, v2);
            const geometry = new THREE.BufferGeometry().setFromPoints(curve.getPoints(60));
            const material = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.55, linewidth: 1.5 });
            connectionLinesGroup.add(new THREE.Line(geometry, material));

            const eyeDiv = document.createElement('div');
            eyeDiv.className = "absolute z-10 pointer-events-none transform -translate-x-1/2 -translate-y-1/2 transition-opacity duration-200";
            eyeDiv.innerHTML = `
                <img src="logo2.png" alt="Flowing Eye" class="w-5 h-5 object-contain eye-blinking-img filter drop-shadow-[0_0_6px_rgba(250,204,21,0.9)]">
            `;
            earthEyesContainer.appendChild(eyeDiv);

            flowingEyeItems.push({
                element: eyeDiv,
                curve: curve,
                progress: Math.random(),
                speed: 0.15 + Math.random() * 0.2
            });
        }

        const globeRadius = 65;
        const vectorNodes = checkinLocations.map(loc => {
            const pos = latLonToVector3(loc.lat, loc.lon, globeRadius);
            const markerMesh = new THREE.Mesh(new THREE.SphereGeometry(1.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
            markerMesh.position.copy(pos);
            globeGroup.add(markerMesh);
            return pos;
        });

        for (let i = 0; i < vectorNodes.length; i++) {
            for (let j = i + 1; j < vectorNodes.length; j++) {
                const dist = vectorNodes[i].distanceTo(vectorNodes[j]);
                if (dist < 115) {
                    createArchLine(vectorNodes[i], vectorNodes[j], (i + j) % 2 === 0 ? 0x00f0ff : 0x38bdf8);
                }
            }
        }

        const cityMarkerElements = checkinLocations.map((loc, idx) => {
            const div = document.createElement('div');
            div.className = "absolute z-10 pointer-events-none transform -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300";
            div.innerHTML = `
                <div class="relative flex items-center justify-center">
                    <div class="absolute w-8 h-8 rounded-full border border-cyan-400/60 animate-ping opacity-60"></div>
                    <img src="logo2.png" alt="Vibe Eye" class="w-6 h-6 object-contain eye-blinking-img filter drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]" style="animation-delay: -${(idx * 0.3).toFixed(1)}s;">
                </div>
            `;
            earthEyesContainer.appendChild(div);
            return { element: div, vector3: vectorNodes[idx] };
        });

        function updateAllEarthMarkers() {
            cityMarkerElements.forEach(item => {
                const worldPos = item.vector3.clone();
                worldPos.applyMatrix4(globeGroup.matrixWorld);
                worldPos.project(camera);

                const screenX = (worldPos.x *  .5 + .5) * window.innerWidth;
                const screenY = (worldPos.y * -.5 + .5) * window.innerHeight;

                if (worldPos.z > 1) {
                    item.element.style.opacity = '0';
                } else {
                    item.element.style.opacity = '1';
                    item.element.style.left = `${screenX}px`;
                    item.element.style.top = `${screenY}px`;
                }
            });

            flowingEyeItems.forEach(item => {
                const point3D = item.curve.getPoint(item.progress);
                const worldPos = point3D.clone();
                worldPos.applyMatrix4(globeGroup.matrixWorld);
                worldPos.project(camera);

                const screenX = (worldPos.x *  .5 + .5) * window.innerWidth;
                const screenY = (worldPos.y * -.5 + .5) * window.innerHeight;

                if (worldPos.z > 1 || screenX < 0 || screenX > window.innerWidth || screenY < 0 || screenY > window.innerHeight) {
                    item.element.style.opacity = '0';
                } else {
                    item.element.style.opacity = '0.9';
                    item.element.style.left = `${screenX}px`;
                    item.element.style.top = `${screenY}px`;
                }
            });

            return {
                x: (cityMarkerElements[0].vector3.clone().applyMatrix4(globeGroup.matrixWorld).project(camera).x * .5 + .5) * window.innerWidth,
                y: (cityMarkerElements[0].vector3.clone().applyMatrix4(globeGroup.matrixWorld).project(camera).y * -.5 + .5) * window.innerHeight
            };
        }

        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        window.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            globeGroup.rotation.y += (e.clientX - prevMouse.x) * 0.005;
            globeGroup.rotation.x += (e.clientY - prevMouse.y) * 0.005;
            prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (!isDragging) {
                globeGroup.rotation.y += 0.0012;
            }

            flowingEyeItems.forEach(item => {
                item.progress += delta * item.speed * 0.35;
                if (item.progress > 1) item.progress = 0;
            });

            renderer.render(scene, camera);
            updateAllEarthMarkers();
        }
        animate();
    </script>
